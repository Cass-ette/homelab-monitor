<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homelab Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        binance: {
                            yellow: '#F0B90B',
                            bg: '#0B0E11',
                            card: '#1E2329',
                            border: '#2B3139',
                            hover: '#2B3139',
                            text: '#EAECEF'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0B0E11;
        }
        .status-online { color: #0ECB81; }
        .status-offline { color: #F6465D; }
        .binance-shadow:hover {
            box-shadow: 0 0 0 1px rgba(240, 185, 11, 0.3);
        }
    </style>
</head>
<body class="text-binance-text">
    <!-- Header -->
    <div class="bg-binance-card border-b border-binance-border">
        <div class="container mx-auto px-4 py-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-2">
                        <svg class="w-8 h-8 text-binance-yellow" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 2L2 7v10c0 5.5 3.8 10.7 10 12 6.2-1.3 10-6.5 10-12V7l-10-5zm0 18.5c-4.8-1.2-8-5.4-8-9.5V8.3l8-4 8 4v2.7c0 4.1-3.2 8.3-8 9.5z"/>
                        </svg>
                        <h1 class="text-xl font-semibold">Homelab Monitor</h1>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <div id="system-status" class="flex items-center space-x-2 text-sm">
                        <div class="w-2 h-2 bg-gray-500 rounded-full"></div>
                        <span class="text-gray-400">Loading...</span>
                    </div>
                    <button onclick="loadStatus()" class="px-4 py-1.5 bg-binance-hover hover:bg-binance-border rounded text-sm transition">
                        Refresh
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-6">
        <div id="servers" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
            <!-- Server cards will be inserted here -->
        </div>
    </div>

    <!-- Port Details Modal -->
    <div id="port-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
        <div class="bg-binance-card border border-binance-border rounded-lg w-full max-w-5xl max-h-[85vh] overflow-hidden">
            <div class="px-6 py-4 border-b border-binance-border flex justify-between items-center">
                <h2 class="text-lg font-semibold" id="port-modal-title">Network Ports</h2>
                <button onclick="closePortModal()" class="text-gray-400 hover:text-white text-2xl leading-none">&times;</button>
            </div>
            <div id="port-modal-content" class="p-6 overflow-y-auto max-h-[75vh]">
                <!-- Port details here -->
            </div>
        </div>
    </div>

    <script>
        let statusData = [];

        async function loadStatus() {
            try {
                const res = await fetch('/api/status');
                statusData = await res.json();
                renderServers();
            } catch (err) {
                console.error('Failed to load status:', err);
            }
        }

        function renderServers() {
            const container = document.getElementById('servers');

            if (statusData.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center text-gray-500 py-20">No servers found</div>';
                return;
            }

            // Update system status
            const onlineCount = statusData.filter(s => s.online).length;
            const totalCount = statusData.length;
            const statusEl = document.getElementById('system-status');

            if (onlineCount === totalCount) {
                statusEl.innerHTML = `
                    <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                    <span class="status-online">All Systems Operational</span>
                `;
            } else if (onlineCount === 0) {
                statusEl.innerHTML = `
                    <div class="w-2 h-2 bg-red-500 rounded-full"></div>
                    <span class="status-offline">All Systems Down</span>
                `;
            } else {
                statusEl.innerHTML = `
                    <div class="w-2 h-2 bg-yellow-500 rounded-full"></div>
                    <span class="text-binance-yellow">${onlineCount}/${totalCount} Online</span>
                `;
            }

            container.innerHTML = statusData.map(s => `
                <div class="bg-binance-card border border-binance-border rounded-lg overflow-hidden binance-shadow transition">
                    <!-- Header -->
                    <div class="px-4 py-3 border-b border-binance-border">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    ${getServerIcon(s.name)}
                                </svg>
                                <h3 class="font-semibold text-base">${s.name}</h3>
                            </div>
                            <div class="flex items-center space-x-2">
                                <div class="w-1.5 h-1.5 ${s.online ? 'bg-green-500' : 'bg-red-500'} rounded-full"></div>
                                <span class="text-xs ${s.online ? 'status-online' : 'status-offline'}">${s.online ? 'Online' : 'Offline'}</span>
                            </div>
                        </div>
                    </div>

                    ${s.online ? `
                        <!-- Stats -->
                        <div class="p-4 space-y-3">
                            <div class="grid grid-cols-2 gap-3">
                                ${renderMetric('CPU', s.cpu, '%')}
                                ${renderMetric('Memory', s.memory, '%')}
                                ${renderMetric('Disk', s.disk, '%')}
                                ${renderMetric('GPU', s.gpu, s.gpu === 'N/A' ? '' : '%')}
                            </div>

                            <div class="pt-3 border-t border-binance-border">
                                <div class="flex justify-between text-xs text-gray-400 mb-1">
                                    <span>Uptime</span>
                                </div>
                                <div class="text-sm">${s.uptime}</div>
                            </div>

                            <button onclick="viewPorts('${s.name}')" class="w-full py-2 bg-binance-yellow hover:bg-yellow-500 text-black font-medium rounded transition text-sm">
                                View Ports
                            </button>
                        </div>
                    ` : `
                        <div class="p-8 text-center">
                            <svg class="w-12 h-12 mx-auto text-gray-600 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                            </svg>
                            <div class="text-sm text-gray-500 mb-1">Server Offline</div>
                            ${s.error ? `<div class="text-xs text-red-400">${s.error}</div>` : ''}
                        </div>
                    `}

                    <!-- Footer -->
                    <div class="px-4 py-2 bg-binance-bg border-t border-binance-border">
                        <div class="text-xs text-gray-600">
                            Updated ${new Date(s.updated_at).toLocaleTimeString()}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderMetric(label, value, unit) {
            const numValue = parseFloat(value);
            let colorClass = 'text-gray-400';

            if (label === 'CPU' || label === 'Memory' || label === 'Disk') {
                if (numValue >= 80) colorClass = 'status-offline';
                else if (numValue >= 60) colorClass = 'text-binance-yellow';
                else colorClass = 'status-online';
            }

            return `
                <div>
                    <div class="text-xs text-gray-500 mb-1">${label}</div>
                    <div class="text-lg font-semibold ${colorClass}">${value}${unit}</div>
                </div>
            `;
        }

        function getServerIcon(name) {
            const icons = {
                server: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"/>',
                home: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>',
                laptop: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>',
                mac: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>'
            };
            return icons[name] || icons.server;
        }

        async function viewPorts(server) {
            document.getElementById('port-modal').classList.remove('hidden');
            document.getElementById('port-modal-title').textContent = `${server} - Network Ports`;
            document.getElementById('port-modal-content').innerHTML = '<div class="text-center text-gray-400 py-8">Loading ports...</div>';

            try {
                const res = await fetch(`/api/ports/${server}`);
                const data = await res.json();

                if (data.ports && data.ports.length > 0) {
                    const tcp = data.ports.filter(p => p.proto.toUpperCase() === 'TCP');
                    const udp = data.ports.filter(p => p.proto.toUpperCase() === 'UDP');

                    let html = '<div class="space-y-4">';

                    if (tcp.length > 0) {
                        html += `
                            <div>
                                <div class="flex items-center space-x-2 mb-3 pb-2 border-b border-binance-border">
                                    <span class="text-sm font-semibold status-online">TCP</span>
                                    <span class="text-xs text-gray-500">${tcp.length} ports</span>
                                </div>
                                <div class="grid grid-cols-5 gap-2">
                                    ${tcp.map(p => `
                                        <div class="bg-binance-bg border border-binance-border hover:border-green-500/50 transition px-3 py-2 rounded text-center">
                                            <div class="font-semibold text-sm status-online">${p.port}</div>
                                            ${p.pid ? `<div class="text-xs text-gray-600 mt-0.5">${p.pid}</div>` : ''}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }

                    if (udp.length > 0) {
                        html += `
                            <div>
                                <div class="flex items-center space-x-2 mb-3 pb-2 border-b border-binance-border">
                                    <span class="text-sm font-semibold text-blue-400">UDP</span>
                                    <span class="text-xs text-gray-500">${udp.length} ports</span>
                                </div>
                                <div class="grid grid-cols-5 gap-2">
                                    ${udp.map(p => `
                                        <div class="bg-binance-bg border border-binance-border hover:border-blue-500/50 transition px-3 py-2 rounded text-center">
                                            <div class="font-semibold text-sm text-blue-400">${p.port}</div>
                                            ${p.pid ? `<div class="text-xs text-gray-600 mt-0.5">${p.pid}</div>` : ''}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }

                    html += '</div>';
                    document.getElementById('port-modal-content').innerHTML = html;
                } else {
                    document.getElementById('port-modal-content').innerHTML = '<div class="text-center text-gray-400 py-8">No ports found</div>';
                }
            } catch (err) {
                document.getElementById('port-modal-content').innerHTML = `<div class="text-center text-red-400 py-8">Error: ${err.message}</div>`;
            }
        }

        function closePortModal() {
            document.getElementById('port-modal').classList.add('hidden');
        }

        // Initial load and auto-refresh
        loadStatus();
        setInterval(loadStatus, 10000);
    </script>
</body>
</html>
